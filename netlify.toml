[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://translate.google.com https://translate.googleapis.com; connect-src 'self' https://opyzvpsbjqcdfeircica.supabase.co https://translate.googleapis.com https://*.stripe.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://translate.googleapis.com; frame-src https://*.stripe.com https://*.netlify.com https://translate.google.com; font-src 'self' data:; form-action 'self' https://*.stripe.com; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Pragma = "no-cache"

[[headers]]
  for = "/.netlify/functions/admin-api"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production redeploy after Stripe test key rotation.
