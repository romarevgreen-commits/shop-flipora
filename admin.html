<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Flipora Administration</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css?v=1">
</head>
<body>
  <header class="admin-header"><a href="/" class="brand"><span>F</span> flipora</a><div><strong>Administration</strong><button id="adminSignOut" hidden>Sign out</button></div></header>
  <main>
    <section class="login-card" id="adminLogin">
      <p class="eyebrow">Restricted access</p><h1>Administrator sign in</h1>
      <p>Authorized administrator: <strong>romarevgreen@gmail.com</strong></p>
      <form id="adminLoginForm">
        <label>Email<input name="email" type="email" value="romarevgreen@gmail.com" readonly></label>
        <label>Password<input name="password" type="password" minlength="8" required autocomplete="current-password"></label>
        <p id="adminMessage" class="message" aria-live="polite"></p>
        <button type="submit">Sign in</button>
        <button class="secondary" id="createAdminAccount" type="button">Create administrator account</button>
        <button class="link-button" id="resetAdminPassword" type="button">Forgot password?</button>
      </form>
    </section>

    <section id="adminDashboard" hidden>
      <div class="dashboard-title"><div><p class="eyebrow">Website control center</p><h1>Flipora Administration</h1><p>romarevgreen@gmail.com · 478-336-3332</p></div><button id="refreshAdmin">Refresh details</button></div>
      <div class="stats" id="adminStats"></div>
      <nav class="tabs" id="adminTabs"><button class="active" data-tab="listings">Listings</button><button data-tab="orders">Orders</button><button data-tab="members">Members</button><button data-tab="accounts">Accounts</button></nav>
      <div class="panel"><div class="panel-head"><h2 id="panelTitle">Listings</h2><input id="adminSearch" type="search" placeholder="Search details"></div><div class="table-wrap"><table><thead id="adminTableHead"></thead><tbody id="adminTableBody"></tbody></table></div></div>
    </section>
  </main>
  <div class="toast" id="adminToast" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="config.js" defer></script>
  <script src="admin.js?v=1" defer></script>
</body>
</html>
